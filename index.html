```html
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hakun Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    /* バージョン表示 */
    #version {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #messages {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .message {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    #messageInput {
      width: 75%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #sendButton {
      width: 20%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>💬 Hakun Chat</h1>

  <!-- バージョン -->
  <div id="version">Version 1.1.0</div>

  <div id="messages"></div>

  <input
    id="messageInput"
    type="text"
    placeholder="メッセージを入力..."
  >

  <button id="sendButton">送信</button>


  <script type="module">

    // =========================
    // バージョン
    // =========================

    const VERSION = "1.1.0";

    document.getElementById("version").textContent =
      "Version " + VERSION;


    // =========================
    // Firebase
    // =========================

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onChildAdded
    }
      from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAzwGUhz54-qSaSMTq-l0PTsr0eyr3Rhsk",
      authDomain: "chat-973d6.firebaseapp.com",
      projectId: "chat-973d6",
      storageBucket: "chat-973d6.firebasestorage.app",
      messagingSenderId: "655321586836",
      appId: "1:655321586836:web:1273752f09b6c6d8662881",
      measurementId: "G-XNZDKL6441"
    };


    const app = initializeApp(firebaseConfig);


    const db = getDatabase(
      app,
      "https://chat-973d6-default-rtdb.asia-southeast1.firebasedatabase.app/"
    );


    const messagesRef = ref(db, "messages");


    // =========================
    // HTML
    // =========================

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const messages =
      document.getElementById("messages");


    // =========================
    // メッセージ送信
    // =========================

    function sendMessage() {

      const text = input.value.trim();

      if (text === "") return;

      push(messagesRef, {
        text: text,
        time: Date.now()
      });

      input.value = "";
      input.focus();

    }


    button.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );


    // =========================
    // リアルタイム受信
    // =========================

    onChildAdded(
      messagesRef,
      (snapshot) => {

        const data = snapshot.val();

        const message =
          document.createElement("div");

        message.className = "message";

        message.textContent = data.text;

        messages.appendChild(message);

        messages.scrollTop =
          messages.scrollHeight;

      }
    );

  </script>

</body>

</html>
