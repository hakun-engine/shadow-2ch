    */

    const PASSWORD = "fackfack";

    // 元画像の最大サイズ
    const MAX_ORIGINAL_SIZE = 5 * 1024 * 1024;

    const MAX_COMPRESSED_SIZE = 650 * 1024;

    const MAX_IMAGE_SIDE = 1600;


    /*

      document.getElementById("imageInput");

      document.getElementById("messages");

      document.getElementById("status");

      document.getElementById("onlineUsers");

    nameInput.value =

        if (!name) {

          alert("名前を入力してください");

          return;

        localStorage.setItem(

    /*
      ==========================================
      Password
      ==========================================
    */

    function unlock() {

      if (
        passwordInput.value === PASSWORD
      ) {

        sessionStorage.setItem(
          "hakunChatUnlocked",
          "true"
        );

        lockScreen.style.display =
          "none";

        appScreen.style.display =

        startChat();

          "block";

      }

    }


    unlockButton.addEventListener(
      "click",
      unlock
    );

      "keydown",

        if (event.key === "Enter") {

          unlock();

        }

      }
    );


    if (
      sessionStorage.getItem(
        "hakunChatUnlocked"
      ) === "true"
    ) {

      lockScreen.style.display =
        "none";

      appScreen.style.display =
        "block";

      startChat();

    }


    /*
      ==========================================
      Utility
      ==========================================
    */

    function getCurrentTime() {

      const now =
        new Date();

      return now.toLocaleTimeString(
        "ja-JP",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
      ==========================================
      画像圧縮
      ==========================================
    */

    async function compressImage(file) {

      if (
        file.size >
        MAX_ORIGINAL_SIZE
      ) {

        throw new Error(
          "画像は5MB以下にしてください"
        );

      }

      const bitmap =
        await createImageBitmap(file);

      let width =
        bitmap.width;

      let height =
        bitmap.height;


      /*
        長辺を1600px以下にする
      */

      const scale =
        Math.min(
          1,
          MAX_IMAGE_SIDE /
          Math.max(width, height)
        );

      width =
        Math.round(width * scale);

      height =
        Math.round(height * scale);


      const canvas =
        document.createElement("canvas");

      canvas.width =
        width;

      canvas.height =
        height;


      const ctx =
        canvas.getContext("2d");

      ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
      );


      /*
        JPEG品質を下げながら
        650KB以下を目指す
      */

      const qualities =
        [
          0.85,
          0.80,
          0.75,
          0.70,
          0.65,
          0.60,
          0.55,
          0.50
        ];


      for (
        const quality of qualities
      ) {

        const blob =
          await new Promise(
            (resolve) => {

              canvas.toBlob(
                resolve,
                "image/jpeg",
                quality
              );

            }
          );


        if (
          blob &&
          blob.size <=
          MAX_COMPRESSED_SIZE
        ) {

          return blob;

        }

      }


      /*
        まだ大きい場合は
        画像サイズ自体をさらに下げる
      */

      let currentWidth =
        width;

      let currentHeight =
        height;


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        currentWidth =
          Math.round(
            currentWidth * 0.8
          );

        currentHeight =
          Math.round(
            currentHeight * 0.8
          );


        canvas.width =
          currentWidth;

        canvas.height =
          currentHeight;


        ctx.drawImage(
          bitmap,
          0,
          0,
          currentWidth,
          currentHeight
        );


        const blob =
          await new Promise(
            (resolve) => {

              canvas.toBlob(
                resolve,
                "image/jpeg",
                0.65
              );

            }
          );


        if (
          blob &&
          blob.size <=
          MAX_COMPRESSED_SIZE
        ) {

          return blob;

        }

      }


      throw new Error(
        "画像を十分に圧縮できませんでした"
      );

    }


    /*
      ==========================================
      Blob → Base64
      ==========================================
    */

    function blobToBase64(blob) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();

          reader.onload =
            () => resolve(
              reader.result
            );

          reader.onerror =
            reject;

          reader.readAsDataURL(blob);

        }
      );

    }


    /*
      ==========================================
      期限切れ画像の削除
      ==========================================
    */

    function cleanupExpiredImages(
      data
    ) {

      const now =
        Date.now();


      for (
        const [key, message]
        of Object.entries(data || {})
      ) {

        if (
          message.image &&
          message.imageExpiresAt &&
          now >=
          message.imageExpiresAt
        ) {

          remove(
            ref(
              db,
              "messages/" + key
            )
          ).catch(
            (error) => {

              console.error(
                "画像削除エラー:",
                error
              );

            }
          );

        }

      }

    }


    /*
      ==========================================
      メッセージ表示
      ==========================================
    */

    function renderMessages(
      data
    ) {

      messagesElement.innerHTML = "";


      const entries =
        Object.entries(data || {});


      entries.sort(
        (a, b) => {

          const timeA =
            a[1].timestamp || 0;

          const timeB =
            b[1].timestamp || 0;

          return timeA - timeB;

        }
      );


      for (
        const [key, message]
        of entries
      ) {

        /*
          期限切れ画像は表示しない
        */

        if (
          message.image &&
          message.imageExpiresAt &&
          Date.now() >=
          message.imageExpiresAt
        ) {

          continue;

        }


        const div =
          document.createElement("div");

        div.className =
          "message";


        const name =
          document.createElement("div");

        name.className =
          "messageName";

        name.textContent =
          message.name ||
          "名無し";


        const time =
          document.createElement("span");

        time.className =
          "messageTime";

        time.textContent =
          message.time || "";


        name.appendChild(time);


        div.appendChild(name);


        /*
          テキスト
        */

        if (message.text) {

          const text =
            document.createElement("div");

          text.className =
            "messageText";

          text.textContent =
            message.text;

          div.appendChild(text);

        }


        /*
          画像
        */

        if (message.image) {

          const image =
            document.createElement("img");

          image.className =
            "messageImage";

          image.src =
            message.image;

          image.alt =
            "送信された画像";

          image.loading =
            "lazy";

          div.appendChild(image);

        }


        /*
          自分のメッセージだけ削除可能
        */

        if (
          message.userId === userId
        ) {

          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "deleteButton";

          deleteButton.textContent =
            "削除";

          deleteButton.addEventListener(
            "click",
            async () => {

              if (
                confirm(
                  "このメッセージを削除しますか？"
                )
              ) {

                await remove(
                  ref(
                    db,
                    "messages/" + key
                  )
                );

              }

            }
          );

          div.appendChild(
            deleteButton
          );

        }


        messagesElement.appendChild(
          div
        );

      }


      /*
        一番下へ
      */

      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    /*
      ==========================================
      テキスト送信
      ==========================================
    */

    async function sendText() {

      const text =
        messageInput.value.trim();

      const name =
        nameInput.value.trim();


      if (!name) {

        alert(
          "先に名前を設定してください"
        );

        return;

      }


      if (!text) {

        return;

      }


      const messageRef =
        push(
          ref(db, "messages")
        );


      await set(
        messageRef,
        {
          name,
          text,
          time:
            getCurrentTime(),
          timestamp:
            serverTimestamp(),
          userId
        }
      );


      messageInput.value =
        "";

    }


    sendButton.addEventListener(
      "click",
      sendText
    );


    /*
      ==========================================
      Enter送信
      ==========================================
    */

    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendText();

        }

      }
    );


    /*
      ==========================================
      画像選択
      ==========================================
    */

    imageButton.addEventListener(
      "click",
      () => {

        imageInput.click();

      }
    );


    imageInput.addEventListener(
      "change",
      async () => {

        const file =
          imageInput.files[0];

        if (!file) {

          return;

        }


        const name =
          nameInput.value.trim();


        if (!name) {

          alert(
            "先に名前を設定してください"
          );

          imageInput.value =
            "";

          return;

        }


        if (
          !file.type.startsWith("image/")
        ) {

          alert(
            "画像ファイルを選択してください"
          );

          imageInput.value =
            "";

          return;

        }


        try {

          sendButton.disabled =
            true;

          imageButton.disabled =
            true;


          statusElement.textContent =
            "画像を圧縮中...";


          const compressed =
            await compressImage(file);


          statusElement.textContent =
            "画像をアップロード中...";


          const base64 =
            await blobToBase64(
              compressed
            );


          const expiresAt =
            Date.now() +
            IMAGE_EXPIRE_TIME;


          const messageRef =
            push(
              ref(db, "messages")
            );


          await set(
            messageRef,
            {
              name,
              text: "",
              image: base64,
              imageExpiresAt:
                expiresAt,
              time:
                getCurrentTime(),
              timestamp:
                serverTimestamp(),
              userId
            }
          );


          statusElement.textContent =
            "画像を送信しました（1時間で削除）";


        } catch (error) {

          console.error(error);

          alert(
            error.message ||
            "画像の送信に失敗しました"
          );

          statusElement.textContent =
            "画像送信に失敗しました";

        } finally {

          sendButton.disabled =
            false;

          imageButton.disabled =
            false;

          imageInput.value =
            "";

        }

      }
    );


    /*
      ==========================================
      Online Presence
      ==========================================
    */

    let presenceRef;


    function updatePresenceName(
      name
    ) {

      if (!presenceRef) {

        return;

      }

      set(
        presenceRef,
        {
          name,
          online: true,
          lastChanged:
            serverTimestamp()
        }
      );

    }


    async function setupPresence() {

      const connectedRef =
        ref(
          db,
          ".info/connected"
        );


      presenceRef =
        ref(
          db,
          "presence/" + userId
        );


      onValue(
        connectedRef,
        async (snapshot) => {

          if (
            snapshot.val() !== true
          ) {

            return;

          }


          const name =
            nameInput.value.trim() ||
            "名無し";


          await onDisconnect(
            presenceRef
          ).set({
            name,
            online: false,
            lastChanged:
              serverTimestamp()
          });


          await set(
            presenceRef,
            {
              name,
              online: true,
              lastChanged:
                serverTimestamp()
            }
          );

        }
      );


      onValue(
        ref(db, "presence"),
        (snapshot) => {

          const data =
            snapshot.val() || {};


          const onlineNames =
            Object.values(data)
              .filter(
                user =>
                  user.online === true
              )
              .map(
                user =>
                  user.name || "名無し"
              );


          onlineUsersElement.textContent =
            `オンライン: ${onlineNames.length}人` +
            (
              onlineNames.length
                ? " — " +
                  onlineNames.join("、")
                : ""
            );

        }
      );

    }


    /*
      ==========================================
      Chat Start
      ==========================================
    */

    function startChat() {

      setupPresence();


      onValue(
        ref(db, "messages"),
        (snapshot) => {

          const data =
            snapshot.val() || {};


          /*
            期限切れ画像を削除
          */

          cleanupExpiredImages(
            data
          );


          /*
            メッセージ表示
          */

          renderMessages(
            data
          );

        }
      );

    }

  </script>
