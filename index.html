  <script type="module">

    /*
    ==========================================
    Firebase
    ==========================================
    */

    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      set,
      remove,
      onValue,
      onDisconnect,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      onAuthStateChanged
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAzwGUhz54-qSaSMTq-l0PTsr0eyr3Rhsk",
      authDomain: "chat-973d6.firebaseapp.com",
      projectId: "chat-973d6",
      storageBucket: "chat-973d6.firebasestorage.app",
      messagingSenderId: "655321586836",
      appId: "1:655321586836:web:1273752f09b6c6d8662881",
      measurementId: "G-XNZDKL6441"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getDatabase(
        app,
        "https://chat-973d6-default-rtdb.asia-southeast1.firebasedatabase.app/"
      );


    /*
    ==========================================
    Firebase Authentication
    ==========================================
    */

    const auth =
      getAuth(app);

    const googleProvider =
      new GoogleAuthProvider();


    /*
    ==========================================
    設定
    ==========================================
    */

    const PASSWORD =
      "fackfack";

    const IMAGE_EXPIRE_TIME =
      60 * 60 * 1000;

    const MAX_ORIGINAL_SIZE =
      5 * 1024 * 1024;

    const MAX_COMPRESSED_SIZE =
      650 * 1024;

    const MAX_IMAGE_SIDE =
      1600;


    /*
    ==========================================
    DOM
    ==========================================
    */

    const loginScreen =
      document.getElementById("loginScreen");

    const googleLoginButton =
      document.getElementById("googleLoginButton");

    const loginError =
      document.getElementById("loginError");

    const lockScreen =
      document.getElementById("lockScreen");

    const appScreen =
      document.getElementById("app");

    const passwordInput =
      document.getElementById("passwordInput");

    const unlockButton =
      document.getElementById("unlockButton");

    const lockError =
      document.getElementById("lockError");

    const accountArea =
      document.getElementById("accountArea");

    const logoutButton =
      document.getElementById("logoutButton");

    const nameInput =
      document.getElementById("nameInput");

    const saveName =
      document.getElementById("saveName");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const imageButton =
      document.getElementById("imageButton");

    const imageInput =
      document.getElementById("imageInput");

    const messagesElement =
      document.getElementById("messages");

    const statusElement =
      document.getElementById("status");

    const onlineUsersElement =
      document.getElementById("onlineUsers");


    /*
    ==========================================
    Firebase User
    ==========================================
    */

    let currentUser = null;

    let userId = null;


    /*
    ==========================================
    TAB ID
    ==========================================
    */

    const tabId =
      crypto.randomUUID();


    /*
    ==========================================
    Name
    ==========================================
    */

    nameInput.value =
      localStorage.getItem(
        "hakunChatName"
      ) || "";


    /*
    ==========================================
    Presence
    ==========================================
    */

    let presenceRef = null;

    let firebaseConnected = false;

    let pageVisible =
      document.visibilityState === "visible";

    let lastPresenceData = {};

    let lastMessageData = null;


    function getPresenceRef() {

      return ref(
        db,
        "presence/" +
        userId +
        "/" +
        tabId
      );

    }


    async function setOffline() {

      if (!presenceRef) {
        return;
      }

      try {

        await set(
          presenceRef,
          {
            name:
              nameInput.value.trim() ||
              "名無し",

            online: false,

            lastChanged:
              serverTimestamp()
          }
        );

      } catch (error) {

        console.error(
          "offline設定エラー:",
          error
        );

      }

    }


    async function setOnline() {

      if (
        !presenceRef ||
        !firebaseConnected ||
        !pageVisible
      ) {

        return;

      }

      const name =
        nameInput.value.trim() ||
        "名無し";


      try {

        await onDisconnect(
          presenceRef
        ).set({

          name,

          online: false,

          lastChanged:
            serverTimestamp()

        });


        await set(
          presenceRef,
          {

            name,

            online: true,

            lastChanged:
              serverTimestamp()

          }
        );

      } catch (error) {

        console.error(
          "online設定エラー:",
          error
        );

      }

    }


    function isUserOnline(
      targetUserId
    ) {

      const tabs =
        lastPresenceData[
          targetUserId
        ] || {};


      return Object.values(tabs)
        .some(
          tab =>
            tab &&
            tab.online === true
        );

    }


    function updateOnlineUsers() {

      const users = {};


      for (
        const [uid, tabs]
        of Object.entries(
          lastPresenceData || {}
        )
      ) {

        if (!tabs) {
          continue;
        }


        const onlineTab =
          Object.values(tabs)
            .find(
              tab =>
                tab &&
                tab.online === true
            );


        if (onlineTab) {

          users[uid] =
            onlineTab.name ||
            "名無し";

        }

      }


      const userList =
        Object.values(users);


      onlineUsersElement.innerHTML =
        "";


      if (userList.length === 0) {

        onlineUsersElement.textContent =
          "オンライン: 0人";

        return;

      }


      const title =
        document.createElement("div");

      title.textContent =
        `オンライン: ${userList.length}人`;

      onlineUsersElement.appendChild(
        title
      );


      for (
        const name of userList
      ) {

        const user =
          document.createElement("div");

        user.className =
          "onlineUser";

        user.textContent =
          "🟢 " + name;

        onlineUsersElement.appendChild(
          user
        );

      }

    }


    function setupPresence() {

      presenceRef =
        getPresenceRef();


      const connectedRef =
        ref(
          db,
          ".info/connected"
        );


      onValue(
        connectedRef,
        async snapshot => {

          firebaseConnected =
            snapshot.val() === true;


          if (
            firebaseConnected &&
            pageVisible
          ) {

            await setOnline();

          } else {

            await setOffline();

          }

        }
      );


      document.addEventListener(
        "visibilitychange",
        async () => {

          pageVisible =
            document.visibilityState ===
            "visible";


          if (pageVisible) {

            await setOnline();

          } else {

            await setOffline();

          }

        }
      );


      window.addEventListener(
        "pagehide",
        () => {

          setOffline();

        }
      );


      onValue(
        ref(db, "presence"),
        snapshot => {

          lastPresenceData =
            snapshot.val() || {};


          updateOnlineUsers();


          if (lastMessageData) {

            renderMessages(
              lastMessageData
            );

          }

        },
        error => {

          console.error(
            "Presence取得エラー:",
            error
          );

          onlineUsersElement.textContent =
            "オンライン情報を取得できません";

        }
      );

    }


    /*
    ==========================================
    Google Login
    ==========================================
    */

    googleLoginButton.addEventListener(
      "click",
      async () => {

        loginError.style.display =
          "none";

        googleLoginButton.disabled =
          true;

        googleLoginButton.textContent =
          "ログイン中...";


        try {

          const result =
            await signInWithPopup(
              auth,
              googleProvider
            );


          currentUser =
            result.user;

          userId =
            currentUser.uid;


          accountArea.textContent =
            "Google: " +
            (
              currentUser.email ||
              "アカウント"
            );


          loginScreen.style.display =
            "none";

          lockScreen.style.display =
            "flex";


        } catch (error) {

          console.error(
            "Googleログインエラー:",
            error
          );


          loginError.textContent =
            "Googleログインに失敗しました: " +
            error.message;

          loginError.style.display =
            "block";

        } finally {

          googleLoginButton.disabled =
            false;

          googleLoginButton.textContent =
            "🔵 Googleでログイン";

        }

      }
    );


    /*
    ==========================================
    Auth状態監視
    ==========================================
    */

    onAuthStateChanged(
      auth,
      user => {

        if (user) {

          currentUser =
            user;

          userId =
            user.uid;


          accountArea.textContent =
            "Google: " +
            (
              user.email ||
              "アカウント"
            );


          loginScreen.style.display =
            "none";


          if (
            sessionStorage.getItem(
              "hakunChatUnlocked"
            ) === "true"
          ) {

            lockScreen.style.display =
              "none";

            appScreen.style.display =
              "block";

            startChat();

          } else {

            lockScreen.style.display =
              "flex";

          }

        } else {

          currentUser =
            null;

          userId =
            null;

          loginScreen.style.display =
            "flex";

          lockScreen.style.display =
            "none";

          appScreen.style.display =
            "none";

        }

      }
    );


    /*
    ==========================================
    Logout
    ==========================================
    */

    logoutButton.addEventListener(
      "click",
      async () => {

        try {

          if (presenceRef) {

            await setOffline();

          }


          await signOut(auth);


          sessionStorage.removeItem(
            "hakunChatUnlocked"
          );


          location.reload();

        } catch (error) {

          console.error(
            "ログアウトエラー:",
            error
          );

          alert(
            "ログアウトに失敗しました"
          );

        }

      }
    );


    /*
    ==========================================
    Password
    ==========================================
    */

    function unlock() {

      if (
        passwordInput.value ===
        PASSWORD
      ) {

        sessionStorage.setItem(
          "hakunChatUnlocked",
          "true"
        );

        lockScreen.style.display =
          "none";

        appScreen.style.display =
          "block";

        startChat();

      } else {

        lockError.style.display =
          "block";

      }

    }


    unlockButton.addEventListener(
      "click",
      unlock
    );


    passwordInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          unlock();

        }

      }
    );


    /*
    ==========================================
    Utility
    ==========================================
    */

    function getCurrentTime() {

      const now =
        new Date();

      return now.toLocaleTimeString(
        "ja-JP",
        {
          hour: "2-digit",
          minute: "2-digit"
        }
      );

    }


    /*
    ==========================================
    画像圧縮
    ==========================================
    */

    async function compressImage(file) {

      if (
        file.size >
        MAX_ORIGINAL_SIZE
      ) {

        throw new Error(
          "画像は5MB以下にしてください"
        );

      }


      const bitmap =
        await createImageBitmap(file);


      let width =
        bitmap.width;

      let height =
        bitmap.height;


      const scale =
        Math.min(
          1,
          MAX_IMAGE_SIDE /
          Math.max(
            width,
            height
          )
        );


      width =
        Math.round(
          width * scale
        );

      height =
        Math.round(
          height * scale
        );


      const canvas =
        document.createElement(
          "canvas"
        );


      canvas.width =
        width;

      canvas.height =
        height;


      let ctx =
        canvas.getContext("2d");


      ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
      );


      const qualities = [
        0.85,
        0.80,
        0.75,
        0.70,
        0.65,
        0.60,
        0.55,
        0.50
      ];


      for (
        const quality of qualities
      ) {

        const blob =
          await new Promise(
            resolve => {

              canvas.toBlob(
                resolve,
                "image/jpeg",
                quality
              );

            }
          );


        if (
          blob &&
          blob.size <=
          MAX_COMPRESSED_SIZE
        ) {

          bitmap.close();

          return blob;

        }

      }


      let currentWidth =
        width;

      let currentHeight =
        height;


      for (
        let i = 0;
        i < 4;
        i++
      ) {

        currentWidth =
          Math.round(
            currentWidth * 0.8
          );

        currentHeight =
          Math.round(
            currentHeight * 0.8
          );


        canvas.width =
          currentWidth;

        canvas.height =
          currentHeight;


        ctx =
          canvas.getContext("2d");


        ctx.drawImage(
          bitmap,
          0,
          0,
          currentWidth,
          currentHeight
        );


        const blob =
          await new Promise(
            resolve => {

              canvas.toBlob(
                resolve,
                "image/jpeg",
                0.65
              );

            }
          );


        if (
          blob &&
          blob.size <=
          MAX_COMPRESSED_SIZE
        ) {

          bitmap.close();

          return blob;

        }

      }


      bitmap.close();


      throw new Error(
        "画像を十分に圧縮できませんでした"
      );

    }


    /*
    ==========================================
    Blob → Base64
    ==========================================
    */

    function blobToBase64(blob) {

      return new Promise(
        (resolve, reject) => {

          const reader =
            new FileReader();


          reader.onload =
            () => resolve(
              reader.result
            );


          reader.onerror =
            reject;


          reader.readAsDataURL(
            blob
          );

        }
      );

    }


    /*
    ==========================================
    期限切れ画像削除
    ==========================================
    */

    function cleanupExpiredImages(
      data
    ) {

      const now =
        Date.now();


      for (
        const [key, message]
        of Object.entries(
          data || {}
        )
      ) {

        if (
          message.image &&
          message.imageExpiresAt &&
          now >=
          message.imageExpiresAt
        ) {

          remove(
            ref(
              db,
              "messages/" +
              key
            )
          ).catch(
            error => {

              console.error(
                "画像削除エラー:",
                error
              );

            }
          );

        }

      }

    }


    /*
    ==========================================
    メッセージ表示
    ==========================================
    */

    function renderMessages(
      data
    ) {

      lastMessageData =
        data;


      messagesElement.innerHTML =
        "";


      const entries =
        Object.entries(
          data || {}
        );


      entries.sort(
        (a, b) => {

          const timeA =
            a[1].timestamp || 0;

          const timeB =
            b[1].timestamp || 0;

          return timeA - timeB;

        }
      );


      for (
        const [key, message]
        of entries
      ) {

        if (
          message.image &&
          message.imageExpiresAt &&
          Date.now() >=
          message.imageExpiresAt
        ) {

          continue;

        }


        const div =
          document.createElement(
            "div"
          );

        div.className =
          "message";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "messageName";


        name.textContent =
          message.name ||
          "名無し";


        const status =
          document.createElement(
            "span"
          );

        status.className =
          "userStatus";


        if (
          isUserOnline(
            message.userId
          )
        ) {

          status.textContent =
            "🟢";

        } else {

          status.textContent =
            "⚫";

        }


        name.appendChild(
          status
        );


        const time =
          document.createElement(
            "span"
          );

        time.className =
          "messageTime";

        time.textContent =
          message.time || "";


        name.appendChild(
          time
        );


        div.appendChild(
          name
        );


        if (
          message.text
        ) {

          const text =
            document.createElement(
              "div"
            );

          text.className =
            "messageText";

          text.textContent =
            message.text;

          div.appendChild(
            text
          );

        }


        if (
          message.image
        ) {

          const image =
            document.createElement(
              "img"
            );

          image.className =
            "messageImage";

          image.src =
            message.image;

          image.alt =
            "送信された画像";

          image.loading =
            "lazy";

          div.appendChild(
            image
          );

        }


        if (
          message.userId === userId
        ) {

          const deleteButton =
            document.createElement(
              "button"
            );

          deleteButton.className =
            "deleteButton";

          deleteButton.textContent =
            "削除";


          deleteButton.addEventListener(
            "click",
            async () => {

              if (
                confirm(
                  "このメッセージを削除しますか？"
                )
              ) {

                try {

                  await remove(
                    ref(
                      db,
                      "messages/" +
                      key
                    )
                  );

                } catch (error) {

                  console.error(
                    "削除エラー:",
                    error
                  );

                  alert(
                    "削除に失敗しました"
                  );

                }

              }

            }
          );


          div.appendChild(
            deleteButton
          );

        }


        messagesElement.appendChild(
          div
        );

      }


      messagesElement.scrollTop =
        messagesElement.scrollHeight;

    }


    /*
    ==========================================
    テキスト送信
    ==========================================
    */

    async function sendText() {

      const text =
        messageInput.value.trim();

      const name =
        nameInput.value.trim();


      if (!currentUser) {

        alert(
          "Googleログインしてください"
        );

        return;

      }


      if (!name) {

        alert(
          "先に名前を設定してください"
        );

        return;

      }


      if (!text) {

        return;

      }


      try {

        const messageRef =
          push(
            ref(
              db,
              "messages"
            )
          );


        await set(
          messageRef,
          {

            name,

            text,

            time:
              getCurrentTime(),

            timestamp:
              serverTimestamp(),

            userId

          }
        );


        messageInput.value =
          "";

      } catch (error) {

        console.error(
          "送信エラー:",
          error
        );

        alert(
          "メッセージの送信に失敗しました"
        );

      }

    }


    sendButton.addEventListener(
      "click",
      sendText
    );


    /*
    ==========================================
    Enter送信
    ==========================================
    */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendText();

        }

      }
    );


    /*
    ==========================================
    名前保存
    ==========================================
    */

    saveName.addEventListener(
      "click",
      async () => {

        const name =
          nameInput.value.trim();


        if (!name) {

          alert(
            "名前を入力してください"
          );

          return;

        }


        localStorage.setItem(
          "hakunChatName",
          name
        );


        if (
          firebaseConnected &&
          pageVisible
        ) {

          await setOnline();

        }


        statusElement.textContent =
          "名前を保存しました";

      }
    );


    /*
    ==========================================
    画像送信
    ==========================================
    */

    imageButton.addEventListener(
      "click",
      () => {

        imageInput.click();

      }
    );


    imageInput.addEventListener(
      "change",
      async () => {

        const file =
          imageInput.files[0];


        if (!file) {

          return;

        }


        const name =
          nameInput.value.trim();


        if (!currentUser) {

          alert(
            "Googleログインしてください"
          );

          imageInput.value =
            "";

          return;

        }


        if (!name) {

          alert(
            "先に名前を設定してください"
          );

          imageInput.value =
            "";

          return;

        }


        if (
          !file.type.startsWith(
            "image/"
          )
        ) {

          alert(
            "画像ファイルを選択してください"
          );

          imageInput.value =
            "";

          return;

        }


        try {

          sendButton.disabled =
            true;

          imageButton.disabled =
            true;


          statusElement.textContent =
            "画像を圧縮中...";


          const compressed =
            await compressImage(
              file
            );


          statusElement.textContent =
            "画像を準備中...";


          const base64 =
            await blobToBase64(
              compressed
            );


          const expiresAt =
            Date.now() +
            IMAGE_EXPIRE_TIME;


          const messageRef =
            push(
              ref(
                db,
                "messages"
              )
            );


          await set(
            messageRef,
            {

              name,

              text: "",

              image:
                base64,

              imageExpiresAt:
                expiresAt,

              time:
                getCurrentTime(),

              timestamp:
                serverTimestamp(),

              userId

            }
          );


          statusElement.textContent =
            "画像を送信しました（1時間で削除）";


        } catch (error) {

          console.error(
            error
          );


          alert(
            error.message ||
            "画像の送信に失敗しました"
          );


          statusElement.textContent =
            "画像送信に失敗しました";

        } finally {

          sendButton.disabled =
            false;

          imageButton.disabled =
            false;

          imageInput.value =
            "";

        }

      }
    );


    /*
    ==========================================
    Chat Start
    ==========================================
    */

    let chatStarted = false;


    function startChat() {

      if (chatStarted) {
        return;
      }

      chatStarted = true;


      setupPresence();


      onValue(
        ref(
          db,
          "messages"
        ),
        snapshot => {

          const data =
            snapshot.val() || {};


          cleanupExpiredImages(
            data
          );


          renderMessages(
            data
          );

        },
        error => {

          console.error(
            "Messages取得エラー:",
            error
          );

          messagesElement.textContent =
            "メッセージを取得できません";

        }
      );

    }

  </script>

</body>
</html>
