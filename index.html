```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hakun Chat</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
    }

    /* ===== ログイン画面 ===== */

    #login {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
      text-align: center;
    }

    #login h1 {
      margin-bottom: 10px;
    }

    #passwordInput {
      width: 100%;
      padding: 13px;
      margin: 15px 0 10px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    #loginButton {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #loginButton:hover {
      opacity: 0.85;
    }

    #error {
      display: none;
      margin-top: 12px;
      color: #e53935;
    }


    /* ===== チャット ===== */

    #chat {
      display: none;
      max-width: 750px;
      margin: auto;
    }

    #chat h1 {
      margin-bottom: 10px;
    }

    #nameInput {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    #chatBox {
      height: 500px;
      margin-top: 15px;
      padding: 15px;
      background: white;
      border-radius: 15px;
      overflow-y: auto;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .message {
      margin-bottom: 12px;
      padding: 11px;
      background: #eeeeee;
      border-radius: 11px;
      word-break: break-word;
    }

    .messageHeader {
      margin-bottom: 5px;
    }

    .name {
      font-weight: bold;
    }

    .time {
      margin-left: 8px;
      color: #777;
      font-size: 12px;
    }

    .deleteButton {
      float: right;
      padding: 4px 8px;
      border: none;
      border-radius: 6px;
      background: #e53935;
      color: white;
      font-size: 12px;
      cursor: pointer;
    }

    .deleteButton:hover {
      opacity: 0.8;
    }


    /* ===== 送信欄 ===== */

    #sendArea {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 16px;
    }

    #sendButton {
      padding: 13px 20px;
      border: none;
      border-radius: 9px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    #sendButton:hover {
      opacity: 0.85;
    }

    #version {
      margin-top: 15px;
      text-align: center;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 600px) {

      body {
        padding: 10px;
      }

      #chatBox {
        height: 60vh;
      }

      #sendButton {
        padding: 13px 15px;
      }

    }
  </style>
</head>


<body>

  <!-- ========================= -->
  <!-- 合言葉画面 -->
  <!-- ========================= -->

  <div id="login">

    <h1>🔐 Hakun Chat</h1>

    <p>合言葉を入力してください</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="合言葉"
      autocomplete="off"
    >

    <button id="loginButton">
      入室
    </button>

    <div id="error">
      合言葉が違います
    </div>

  </div>



  <!-- ========================= -->
  <!-- チャット画面 -->
  <!-- ========================= -->

  <div id="chat">

    <h1>💬 Hakun Chat</h1>

    <input
      type="text"
      id="nameInput"
      placeholder="名前を入力"
      maxlength="20"
    >


    <div id="chatBox"></div>


    <div id="sendArea">

      <input
        type="text"
        id="messageInput"
        placeholder="メッセージを入力"
        maxlength="500"
      >

      <button id="sendButton">
        送信
      </button>

    </div>


    <div id="version">
      Version 1.3.1
    </div>

  </div>



  <!-- ========================= -->
  <!-- Firebase -->
  <!-- ========================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      push,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";



    /* ===== Firebase設定 ===== */

    const firebaseConfig = {

      apiKey: "AIzaSyAzwGUhz54-qSaSMTq-l0PTsr0eyr3Rhsk",

      authDomain:
        "chat-973d6.firebaseapp.com",

      projectId:
        "chat-973d6",

      storageBucket:
        "chat-973d6.firebasestorage.app",

      messagingSenderId:
        "655321586836",

      appId:
        "1:655321586836:web:1273752f09b6c6d8662881",

      measurementId:
        "G-XNZDKL6441"

    };



    /* ===== Firebase開始 ===== */

    const app =
      initializeApp(firebaseConfig);



    /*
      ★重要
      正しいRealtime Database URL
    */

    const db =
      getDatabase(
        app,
        "https://chat-973d6-default-rtdb.asia-southeast1.firebasedatabase.app/"
      );



    const messagesRef =
      ref(db, "messages");



    /* ===== ユーザーID ===== */

    let userId =
      localStorage.getItem(
        "hakunChatUserId"
      );


    if (!userId) {

      userId =
        crypto.randomUUID();

      localStorage.setItem(
        "hakunChatUserId",
        userId
      );

    }



    /* ===== 名前 ===== */

    const nameInput =
      document.getElementById(
        "nameInput"
      );


    nameInput.value =
      localStorage.getItem(
        "hakunChatName"
      ) || "";


    nameInput.addEventListener(
      "input",
      () => {

        localStorage.setItem(
          "hakunChatName",
          nameInput.value
        );

      }
    );



    /* ========================= */
    /* 合言葉 */
    /* ========================= */

    const CORRECT_PASSWORD =
      "fackfack";


    const login =
      document.getElementById(
        "login"
      );


    const chat =
      document.getElementById(
        "chat"
      );


    const passwordInput =
      document.getElementById(
        "passwordInput"
      );


    const error =
      document.getElementById(
        "error"
      );


    function unlockChat() {

      if (
        passwordInput.value ===
        CORRECT_PASSWORD
      ) {

        sessionStorage.setItem(
          "hakunChatUnlocked",
          "true"
        );

        login.style.display =
          "none";

        chat.style.display =
          "block";

        passwordInput.value = "";

        error.style.display =
          "none";

      } else {

        error.style.display =
          "block";

        passwordInput.select();

      }

    }


    document
      .getElementById("loginButton")
      .addEventListener(
        "click",
        unlockChat
      );


    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          unlockChat();

        }

      }
    );



    /* ========================= */
    /* 送信 */
    /* ========================= */

    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    async function sendMessage() {

      const name =
        nameInput.value.trim();


      const text =
        messageInput.value.trim();


      if (!name) {

        alert(
          "名前を入力してください"
        );

        nameInput.focus();

        return;

      }


      if (!text) {

        return;

      }


      const now =
        new Date();


      const time =
        now.toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      try {

        await push(
          messagesRef,
          {

            name: name,

            text: text,

            time: time,

            userId: userId,

            timestamp:
              Date.now()

          }
        );


        messageInput.value = "";

        messageInput.focus();


      } catch (error) {

        console.error(error);

        alert(
          "送信できませんでした。Firebaseの設定を確認してください。"
        );

      }

    }



    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          sendMessage();

        }

      }
    );



    /* ========================= */
    /* メッセージ表示 */
    /* ========================= */

    const chatBox =
      document.getElementById(
        "chatBox"
      );


    onValue(
      messagesRef,
      (snapshot) => {

        chatBox.innerHTML = "";


        snapshot.forEach(
          (child) => {

            const data =
              child.val();


            const message =
              document.createElement(
                "div"
              );


            message.className =
              "message";


            /* ヘッダー */

            const header =
              document.createElement(
                "div"
              );


            header.className =
              "messageHeader";


            /* 名前 */

            const name =
              document.createElement(
                "span"
              );


            name.className =
              "name";


            name.textContent =
              data.name || "名無し";


            header.appendChild(
              name
            );


            /* 時刻 */

            const time =
              document.createElement(
                "span"
              );


            time.className =
              "time";


            time.textContent =
              data.time || "";


            header.appendChild(
              time
            );


            /* 削除 */

            if (
              data.userId ===
              userId
            ) {

              const deleteButton =
                document.createElement(
                  "button"
                );


              deleteButton.className =
                "deleteButton";


              deleteButton.textContent =
                "削除";


              deleteButton.addEventListener(
                "click",
                async () => {

                  const ok =
                    confirm(
                      "このメッセージを削除しますか？"
                    );


                  if (!ok) return;


                  try {

                    await remove(
                      ref(
                        db,
                        "messages/" +
                        child.key
                      )
                    );

                  } catch (error) {

                    console.error(
                      error
                    );

                    alert(
                      "削除できませんでした"
                    );

                  }

                }
              );


              header.appendChild(
                deleteButton
              );

            }


            /* 本文 */

            const text =
              document.createElement(
                "div"
              );


            text.textContent =
              data.text || "";


            message.appendChild(
              header
            );


            message.appendChild(
              text
            );


            chatBox.appendChild(
              message
            );

          }
        );


        /* 一番下へ */

        chatBox.scrollTop =
          chatBox.scrollHeight;

      }
    );



    /* ========================= */
    /* ページを更新しても */
    /* このタブでは入室状態を維持 */
    /* ========================= */

    if (
      sessionStorage.getItem(
        "hakunChatUnlocked"
      ) === "true"
    ) {

      login.style.display =
        "none";

      chat.style.display =
        "block";

    }

  </script>

</body>
</html>
