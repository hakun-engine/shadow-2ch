<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シャドー2ch（オンライン交信所）</title>
    <style>
        body {
            background-color: #efefef;
            font-family: "MS UI Gothic", sans-serif;
            color: #111;
            margin: 20px;
        }
        .board-container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            position: relative;
        }
        h2 {
            color: #800;
            font-size: 1.4em;
            border-bottom: 2px solid #800;
            padding-bottom: 5px;
            margin-top: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .version {
            font-size: 0.5em;
            color: #666;
            font-weight: normal;
        }
        .form-area {
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .form-area label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
        .form-area input, .form-area textarea {
            width: calc(100% - 70px);
            padding: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .form-area textarea {
            height: 60px;
            vertical-align: top;
        }
        .post {
            border-bottom: 1px dashed #ccc;
            padding: 8px 0;
            font-size: 0.95em;
        }
        .post-num {
            color: blue;
            font-weight: bold;
        }
        .post-name {
            color: green;
            font-weight: bold;
        }
        .post-date {
            color: #666;
            font-size: 0.85em;
        }
        .post-body {
            margin-top: 4px;
            white-space: pre-wrap;
        }
        button {
            background: linear-gradient(to bottom, #eee, #ccc);
            border: 1px solid #777;
            padding: 4px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background: #bbb;
        }
        .status {
            font-size: 0.85em;
            color: #080;
            margin-bottom: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="board-container">
    <h2>
        シャドー2ch（オンライン交信所）
        <span class="version" id="versionDisplay">v1.1.0</span>
    </h2>
    <div class="status" id="statusMsg">🌐 接続中...</div>

    <!-- 投稿フォーム -->
    <div class="form-area">
        <div>
            <label>名前:</label>
            <input type="text" id="nameInput" value="名無しさん＠お腹いっぱい。">
        </div>
        <div>
            <label>本文:</label>
            <textarea id="msgInput" placeholder="ここに書くとネットの向こうの人にも見えるよ"></textarea>
        </div>
        <div style="text-align: right;">
            <button onclick="postMessage()">書き込む</button>
        </div>
    </div>

    <!-- 掲示板スレッド表示エリア -->
    <div id="threadContainer">
        <p>読み込み中...</p>
    </div>
</div>

<script>
    const APP_VERSION = "v1.1.0";
    const KV_URL = "https://kvdb.io/5Jz3vK2xQ5n3K2xQ5n3K2x/shadow-2ch-messages";

    window.onload = function() {
        console.log("App Version: " + APP_VERSION);
        loadBoard();
    };

    function loadBoard() {
        document.getElementById("statusMsg").innerText = "⏳ 読み込み中...";
        
        fetch(KV_URL)
            .then(res => {
                if (!res.ok) {
                    throw new Error(`HTTPエラー! ステータス: ${res.status} (${res.statusText})`);
                }
                return res.json();
            })
            .then(messages => {
                if (!Array.isArray(messages)) messages = [];
                renderMessages(messages);
                document.getElementById("statusMsg").innerText = `🟢 オンライン交信中 (${APP_VERSION})`;
            })
            .catch(err => {
                console.warn("Load Error:", err);
                renderMessages([]);
                document.getElementById("statusMsg").innerText = `🟡 ローカル/オフラインモード (${err.message})`;
            });
    }

    function renderMessages(messages) {
        const container = document.getElementById("threadContainer");
        if (!messages || messages.length === 0) {
            container.innerHTML = "<p>まだ書き込みはありません。最初のレスを投稿してみよう！</p>";
            return;
        }

        let html = "";
        messages.forEach((msg, index) => {
            const num = index + 1;
            html += `
                <div class="post">
                    <div>
                        <span class="post-num">${num}</span>：
                        <span class="post-name">${escapeHTML(msg.name)}</span>：
                        <span class="post-date">${escapeHTML(msg.date)}</span>
                    </div>
                    <div class="post-body">${escapeHTML(msg.body)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function postMessage() {
        const name = document.getElementById("nameInput").value || "名無しさん";
        const body = document.getElementById("msgInput").value;

        if (!body.trim()) {
            alert("本文を入力してください。");
            return;
        }

        const now = new Date();
        const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}(${['日','月','火','水','木','金','土'][now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        document.getElementById("statusMsg").innerText = "⏳ 送信中...";

        // 1. 現在のデータを取得してから追加して送信
        fetch(KV_URL)
            .then(res => {
                // 初回などでデータが空（404等）の場合の考慮
                if (res.status === 404) return [];
                if (!res.ok) throw new Error(`データ取得失敗: ${res.status}`);
                return res.json().catch(() => []);
            })
            .then(messages => {
                if (!Array.isArray(messages)) messages = [];
                messages.push({ name: name, body: body, date: dateStr });

                // 2. サーバーに保存（POST送信）
                return fetch(KV_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(messages)
                });
            })
            .then(res => {
                if (res.ok) {
                    document.getElementById("msgInput").value = "";
                    loadBoard();
                } else {
                    // ここで具体的なHTTPステータスコードを教えてくれるように変更！
                    throw new Error(`サーバー保存失敗: ステータスコード ${res.status}`);
                }
            })
            .catch(err => {
                console.error("Post Error:", err);
                alert("書き込みに失敗しました。\n【エラー詳細】: " + err.message);
                document.getElementById("statusMsg").innerText = "🔴 エラー: " + err.message;
            });
    }

    function escapeHTML(str) {
        if (!str) return "";
        return str.replace(/[&'`"<>]/g, function(match) {
            return {
                '&': '&amp;',
                "'": '&#x27;',
                '`': '&#x60;',
                '"': '&quot;',
                '<': '&lt;',
                '>': '&gt;',
            }[match]
        });
    }
</script>

</body>
</html>
