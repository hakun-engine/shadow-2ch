<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シャドー2ch（オンライン通信中）</title>
    <style>
        body {
            background-color: #efefef;
            font-family: "MS UI Gothic", sans-serif;
            color: #111;
            margin: 20px;
        }
        .board-container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
        }
        h2 {
            color: #800;
            font-size: 1.4em;
            border-bottom: 2px solid #800;
            padding-bottom: 5px;
            margin-top: 0;
        }
        .form-area {
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .form-area label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
        .form-area input, .form-area textarea {
            width: calc(100% - 70px);
            padding: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .form-area textarea {
            height: 60px;
            vertical-align: top;
        }
        .post {
            border-bottom: 1px dashed #ccc;
            padding: 8px 0;
            font-size: 0.95em;
        }
        .post-num {
            color: blue;
            font-weight: bold;
        }
        .post-name {
            color: green;
            font-weight: bold;
        }
        .post-date {
            color: #666;
            font-size: 0.85em;
        }
        .post-body {
            margin-top: 4px;
            white-space: pre-wrap;
        }
        button {
            background: linear-gradient(to bottom, #eee, #ccc);
            border: 1px solid #777;
            padding: 4px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background: #bbb;
        }
        .status {
            font-size: 0.85em;
            color: #555;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="board-container">
    <h2>シャドー2ch（オンライン交信所）</h2>
    <div class="status" id="statusMsg">🌐 サーバーと通信中...</div>

    <!-- 投稿フォーム -->
    <div class="form-area">
        <div>
            <label>名前:</label>
            <input type="text" id="nameInput" value="名無しさん＠お腹いっぱい。">
        </div>
        <div>
            <label>本文:</label>
            <textarea id="msgInput" placeholder="ここに本文を入力すると他の人にも見えるよ"></textarea>
        </div>
        <div style="text-align: right;">
            <button onclick="postMessage()">書き込む</button>
        </div>
    </div>

    <!-- 掲示板スレッド表示エリア -->
    <div id="threadContainer">
        <p>読み込み中...</p>
    </div>
</div>

<script>
    // 共有用の安全なオンラインストレージ（JSONBinの専用BIN）を使用
    const BIN_ID = "679069d2ad19ca34f8d9b139"; 
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
    const PUT_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    window.onload = function() {
        fetchMessages();
    };

    function fetchMessages() {
        document.getElementById("statusMsg").innerText = "🌐 サーバーからデータを取得中...";
        
        fetch(API_URL, {
            headers: {
                // 公開読み取り用の設定
                'X-Bin-Meta': 'false'
            }
        })
        .then(response => response.json())
        .then(data => {
            // データを安全に取得（messages配列を取り出す）
            let messages = [];
            if (data && data.messages) {
                messages = data.messages;
            } else if (data && data.record && data.record.messages) {
                messages = data.record.messages;
            }
            renderMessages(messages);
            document.getElementById("statusMsg").innerText = "🟢 オンライン交信準備完了（書き込み可能）";
        })
        .catch(error => {
            console.error(error);
            document.getElementById("statusMsg").innerText = "🔴 データの取得に失敗しました";
            document.getElementById("threadContainer").innerHTML = "<p style='color:red;'>読み込みエラーが発生しました。時間を置いてリロードしてください。</p>";
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById("threadContainer");
        if (!messages || messages.length === 0) {
            container.innerHTML = "<p>まだ書き込みはありません。最初のレスを投稿してみよう！</p>";
            return;
        }

        let html = "";
        messages.forEach((msg, index) => {
            const num = index + 1;
            html += `
                <div class="post">
                    <div>
                        <span class="post-num">${num}</span>：
                        <span class="post-name">${escapeHTML(msg.name || "名無しさん")}</span>：
                        <span class="post-date">${escapeHTML(msg.date || "")}</span>
                    </div>
                    <div class="post-body">${escapeHTML(msg.body || "")}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function postMessage() {
        const name = document.getElementById("nameInput").value || "名無しさん";
        const body = document.getElementById("msgInput").value;

        if (!body.trim()) {
            alert("本文を入力してください。");
            return;
        }

        const now = new Date();
        const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}(${['日','月','火','水','木','金','土'][now.getDay()]}） ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        document.getElementById("statusMsg").innerText = "⏳ サーバーに送信中...";

        // 1. まず最新データを取得してから書き込む
        fetch(API_URL, { headers: { 'X-Bin-Meta': 'false' } })
            .then(res => res.json())
            .then(data => {
                let messages = [];
                if (data && data.messages) {
                    messages = data.messages;
                } else if (data && data.record && data.record.messages) {
                    messages = data.record.messages;
                }

                // 新しい書き込みを追加
                messages.push({ name: name, body: body, date: dateStr });

                // 2. クラウドサーバーへ保存（PUT送信）
                return fetch(PUT_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ messages: messages })
                });
            })
            .then(res => {
                if (res.ok) {
                    document.getElementById("msgInput").value = "";
                    fetchMessages(); // 最新状態に再読み込み
                } else {
                    alert("書き込みに失敗しました。");
                    document.getElementById("statusMsg").innerText = "🔴 書き込みエラー";
                }
            })
            .catch(err => {
                alert("エラーが発生しました: " + err);
                document.getElementById("statusMsg").innerText = "🔴 通信エラー";
            });
    }

    function escapeHTML(str) {
        if (!str) return "";
        return String(str).replace(/[&'`"<>]/g, function(match) {
            return {
                '&': '&amp;',
                "'": '&#x27;',
                '`': '&#x60;',
                '"': '&quot;',
                '<': '&lt;',
                '>': '&gt;',
            }[match]
        });
    }
</script>

</body>
</html>
