```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hakun Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    #login {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
    }

    #login input {
      width: 90%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #login button {
      width: 96%;
      background: #333;
      color: white;
    }

    #error {
      color: red;
      margin-top: 10px;
      display: none;
    }

    #chat {
      display: none;
      max-width: 700px;
      margin: auto;
    }

    #chatBox {
      background: white;
      min-height: 400px;
      padding: 15px;
      border-radius: 15px;
      margin-top: 15px;
      overflow-y: auto;
    }

    .message {
      padding: 10px;
      margin-bottom: 10px;
      background: #eee;
      border-radius: 10px;
    }

    .name {
      font-weight: bold;
    }

    .time {
      font-size: 12px;
      color: #777;
      margin-left: 8px;
    }

    .delete {
      float: right;
      background: #d33;
      color: white;
      padding: 5px 8px;
      font-size: 12px;
    }

    #sendArea {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    #messageInput {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #sendButton {
      background: #333;
      color: white;
    }

    #version {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <!-- 合言葉画面 -->
  <div id="login">
    <h1>🔐 Hakun Chat</h1>
    <p>合言葉を入力してください</p>

    <input
      type="password"
      id="passwordInput"
      placeholder="合言葉"
      autocomplete="off"
    >

    <button onclick="checkPassword()">入室</button>

    <div id="error">合言葉が違います</div>
  </div>


  <!-- チャット画面 -->
  <div id="chat">

    <h1>💬 Hakun Chat</h1>

    <input
      type="text"
      id="nameInput"
      placeholder="名前を入力"
      maxlength="20"
    >

    <div id="chatBox"></div>

    <div id="sendArea">
      <input
        type="text"
        id="messageInput"
        placeholder="メッセージを入力"
        maxlength="500"
      >

      <button id="sendButton">送信</button>
    </div>

    <div id="version">Version 1.3.0</div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      push,
      onValue,
      remove
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAzwGUhz54-qSaSMTq-l0PTsr0eyr3Rhsk",
      authDomain: "chat-973d6.firebaseapp.com",
      projectId: "chat-973d6",
      storageBucket: "chat-973d6.firebasestorage.app",
      messagingSenderId: "655321586836",
      appId: "1:655321586836:web:1273752f09b6c6d8662881",
      measurementId: "G-XNZDKL6441"
    };


    const app = initializeApp(firebaseConfig);

    const db = getDatabase(
      app,
      "https://chat-973d6.asia-southeast1.firebasedatabase.app/"
    );


    const messagesRef = ref(db, "messages");


    // ブラウザごとのユーザーID
    let userId = localStorage.getItem("hakunChatUserId");

    if (!userId) {
      userId =
        Math.random().toString(36).substring(2) +
        Date.now().toString(36);

      localStorage.setItem("hakunChatUserId", userId);
    }


    // 名前を保存
    const nameInput = document.getElementById("nameInput");

    nameInput.value =
      localStorage.getItem("hakunChatName") || "";


    nameInput.addEventListener("change", () => {
      localStorage.setItem(
        "hakunChatName",
        nameInput.value
      );
    });


    // 合言葉チェック
    window.checkPassword = function () {

      const password =
        document.getElementById("passwordInput").value;

      if (password === "fackfack") {

        sessionStorage.setItem(
          "hakunChatUnlocked",
          "true"
        );

        document.getElementById("login").style.display = "none";
        document.getElementById("chat").style.display = "block";

      } else {

        document.getElementById("error").style.display = "block";

      }
    };


    // Enterでも入室
    document.getElementById("passwordInput")
      .addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
          checkPassword();
        }

      });


    // メッセージ送信
    document.getElementById("sendButton")
      .addEventListener("click", sendMessage);


    document.getElementById("messageInput")
      .addEventListener("keydown", (event) => {

        if (event.key === "Enter") {
          sendMessage();
        }

      });


    function sendMessage() {

      const name =
        nameInput.value.trim();

      const text =
        document.getElementById("messageInput")
          .value.trim();


      if (!name) {
        alert("名前を入力してください");
        return;
      }

      if (!text) return;


      const now = new Date();

      const time =
        now.toLocaleTimeString(
          "ja-JP",
          {
            hour: "2-digit",
            minute: "2-digit"
          }
        );


      push(messagesRef, {

        name: name,
        text: text,
        time: time,
        userId: userId

      });


      document.getElementById("messageInput")
        .value = "";

    }


    // メッセージをリアルタイム表示
    onValue(messagesRef, (snapshot) => {

      const chatBox =
        document.getElementById("chatBox");

      chatBox.innerHTML = "";


      snapshot.forEach((child) => {

        const data = child.val();

        const message =
          document.createElement("div");

        message.className = "message";


        const header =
          document.createElement("div");

        const name =
          document.createElement("span");

        name.className = "name";

        name.textContent =
          data.name;


        const time =
          document.createElement("span");

        time.className = "time";

        time.textContent =
          data.time;


        header.appendChild(name);
        header.appendChild(time);


        // 自分のメッセージなら削除ボタン
        if (data.userId === userId) {

          const deleteButton =
            document.createElement("button");

          deleteButton.className = "delete";

          deleteButton.textContent = "削除";


          deleteButton.onclick = () => {

            remove(
              ref(
                db,
                "messages/" + child.key
              )
            );

          };


          header.appendChild(deleteButton);

        }


        const text =
          document.createElement("div");

        text.textContent =
          data.text;


        message.appendChild(header);
        message.appendChild(text);


        chatBox.appendChild(message);

      });


      chatBox.scrollTop =
        chatBox.scrollHeight;

    });


    // ページを開いたとき、
    // このタブですでに認証済みなら直接チャットへ
    if (
      sessionStorage.getItem(
        "hakunChatUnlocked"
      ) === "true"
    ) {

      document.getElementById("login").style.display = "none";
      document.getElementById("chat").style.display = "block";

    }

  </script>

</body>
</html>
