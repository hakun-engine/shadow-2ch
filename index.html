```html
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hakun Chat</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    #version {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 20px;
    }

    #nameArea {
      margin-bottom: 15px;
    }

    #nameInput {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #messages {
      border: 1px solid #ccc;
      border-radius: 10px;
      padding: 15px;
      height: 400px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .message {
      background: #f1f1f1;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .messageHeader {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .messageTime {
      color: #777;
      font-size: 12px;
      margin-left: 8px;
      font-weight: normal;
    }

    .deleteButton {
      margin-top: 7px;
      border: none;
      border-radius: 5px;
      padding: 5px 9px;
      cursor: pointer;
      font-size: 12px;
    }

    #inputArea {
      display: flex;
      gap: 8px;
    }

    #messageInput {
      flex: 1;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #sendButton {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
  </style>

</head>


<body>

  <h1>💬 Hakun Chat</h1>

  <div id="version">
    Version 1.2.0
  </div>


  <!-- 名前 -->
  <div id="nameArea">

    <input
      id="nameInput"
      type="text"
      maxlength="20"
      placeholder="名前を入力"
    >

  </div>


  <!-- メッセージ -->
  <div id="messages"></div>


  <!-- 入力 -->
  <div id="inputArea">

    <input
      id="messageInput"
      type="text"
      maxlength="500"
      placeholder="メッセージを入力..."
    >

    <button id="sendButton">
      送信
    </button>

  </div>


  <script type="module">

    // =========================
    // バージョン
    // =========================

    const VERSION = "1.2.0";

    document.getElementById("version").textContent =
      "Version " + VERSION;


    // =========================
    // Firebase
    // =========================

    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


    import {
      getDatabase,
      ref,
      push,
      onChildAdded,
      remove
    } from
      "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


    const firebaseConfig = {

      apiKey:
        "AIzaSyAzwGUhz54-qSaSMTq-l0PTsr0eyr3Rhsk",

      authDomain:
        "chat-973d6.firebaseapp.com",

      projectId:
        "chat-973d6",

      storageBucket:
        "chat-973d6.firebasestorage.app",

      messagingSenderId:
        "655321586836",

      appId:
        "1:655321586836:web:1273752f09b6c6d8662881",

      measurementId:
        "G-XNZDKL6441"
    };


    const app =
      initializeApp(firebaseConfig);


    const db =
      getDatabase(
        app,
        "https://chat-973d6-default-rtdb.asia-southeast1.firebasedatabase.app/"
      );


    const messagesRef =
      ref(db, "messages");


    // =========================
    // HTML
    // =========================

    const nameInput =
      document.getElementById("nameInput");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const messages =
      document.getElementById("messages");


    // =========================
    // 自分を識別するID
    // =========================

    let userId =
      localStorage.getItem("hakunChatUserId");


    if (!userId) {

      userId =
        crypto.randomUUID();

      localStorage.setItem(
        "hakunChatUserId",
        userId
      );

    }


    // =========================
    // 名前を保存
    // =========================

    const savedName =
      localStorage.getItem("hakunChatName");


    if (savedName) {

      nameInput.value =
        savedName;

    }


    nameInput.addEventListener(
      "input",
      () => {

        localStorage.setItem(
          "hakunChatName",
          nameInput.value
        );

      }
    );


    // =========================
    // 時刻
    // =========================

    function formatTime(timestamp) {

      const date =
        new Date(timestamp);

      const hours =
        String(
          date.getHours()
        ).padStart(2, "0");

      const minutes =
        String(
          date.getMinutes()
        ).padStart(2, "0");

      return `${hours}:${minutes}`;

    }


    // =========================
    // メッセージ送信
    // =========================

    function sendMessage() {

      const name =
        nameInput.value.trim();

      const text =
        messageInput.value.trim();


      if (name === "") {

        alert("名前を入力してください");

        nameInput.focus();

        return;

      }


      if (text === "") {

        return;

      }


      const messageData = {

        name: name,

        text: text,

        time: Date.now(),

        userId: userId

      };


      push(
        messagesRef,
        messageData
      );


      messageInput.value = "";

      messageInput.focus();

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (event.key === "Enter") {

          sendMessage();

        }

      }
    );


    // =========================
    // メッセージ受信
    // =========================

    onChildAdded(
      messagesRef,
      (snapshot) => {

        const data =
          snapshot.val();

        const messageKey =
          snapshot.key;


        const message =
          document.createElement("div");

        message.className =
          "message";


        // ヘッダー
        const header =
          document.createElement("div");

        header.className =
          "messageHeader";


        const name =
          document.createElement("span");

        name.textContent =
          data.name;


        const time =
          document.createElement("span");

        time.className =
          "messageTime";

        time.textContent =
          formatTime(data.time);


        header.appendChild(name);

        header.appendChild(time);


        // 本文
        const text =
          document.createElement("div");

        text.textContent =
          data.text;


        message.appendChild(header);

        message.appendChild(text);


        // =========================
        // 削除ボタン
        // =========================

        if (data.userId === userId) {

          const deleteButton =
            document.createElement("button");

          deleteButton.className =
            "deleteButton";

          deleteButton.textContent =
            "🗑️ 削除";


          deleteButton.addEventListener(
            "click",
            async () => {

              const confirmed =
                confirm(
                  "このメッセージを削除しますか？"
                );


              if (!confirmed) {

                return;

              }


              await remove(
                ref(
                  db,
                  "messages/" + messageKey
                )
              );


              message.remove();

            }
          );


          message.appendChild(
            deleteButton
          );

        }


        messages.appendChild(
          message
        );


        messages.scrollTop =
          messages.scrollHeight;

      }
    );

  </script>

</body>

</html>
