<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>2ch風掲示板</title>
    <style>
        body {
            background-color: #efefef;
            font-family: "MS UI Gothic", sans-serif;
            color: #111;
            margin: 20px;
        }
        .board-container {
            max-width: 700px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
        }
        h2 {
            color: #800;
            font-size: 1.4em;
            border-bottom: 2px solid #800;
            padding-bottom: 5px;
            margin-top: 0;
        }
        .form-area {
            background: #f0f0f0;
            padding: 10px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
        }
        .form-area label {
            display: inline-block;
            width: 60px;
            font-weight: bold;
        }
        .form-area input, .form-area textarea {
            width: calc(100% - 70px);
            padding: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }
        .form-area textarea {
            height: 60px;
            vertical-align: top;
        }
        .post {
            border-bottom: 1px dashed #ccc;
            padding: 8px 0;
            font-size: 0.95em;
        }
        .post-num {
            color: blue;
            font-weight: bold;
        }
        .post-name {
            color: green;
            font-weight: bold;
        }
        .post-date {
            color: #666;
            font-size: 0.85em;
        }
        .post-body {
            margin-top: 4px;
            white-space: pre-wrap;
        }
        button {
            background: linear-gradient(to bottom, #eee, #ccc);
            border: 1px solid #777;
            padding: 4px 15px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active {
            background: #bbb;
        }
    </style>
</head>
<body>

<div class="board-container">
    <h2>なんでも実況・雑談（2ch風テスト）</h2>

    <!-- 投稿フォーム -->
    <div class="form-area">
        <div>
            <label>名前:</label>
            <input type="text" id="nameInput" value="名無しさん＠お腹いっぱい。">
        </div>
        <div>
            <label>本文:</label>
            <textarea id="msgInput" placeholder="ここに本文を入力"></textarea>
        </div>
        <div style="text-align: right;">
            <button onclick="postMessage()">書き込む</button>
        </div>
    </div>

    <!-- 掲示板スレッド表示エリア -->
    <div id="threadContainer">
        <p>読み込み中...</p>
    </div>
</div>

<script>
    // ※学習用メモ：本来はAPIキーが露出するため実運用ではバックエンドを挟みますが、今回はテスト用に簡易公開APIを使っています
    const BIN_ID = "679069d2ad19ca34f8d9b139"; // サンプル用の共有ストレージID（自分でJSONBin無料アカウントを作って変更も可能）
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    // ページ読み込み時に過去の書き込みを取得
    window.onload = function() {
        fetchMessages();
    };

    function fetchMessages() {
        fetch(API_URL, {
            headers: {
                'X-Access-Key': '$2a$10$T8Vq0v5X0...（簡易テスト用）' // ※自分用のキーに置き換えてもOK
            }
        })
        .then(response => response.json())
        .then(data => {
            const messages = data.record.messages || [];
            renderMessages(messages);
        })
        .catch(error => {
            // オフラインやエラー時のフォールバック（ローカルストレージ）
            loadLocalFallback();
        });
    }

    function renderMessages(messages) {
        const container = document.getElementById("threadContainer");
        if (messages.length === 0) {
            container.innerHTML = "<p>まだ書き込みはありません。</p>";
            return;
        }

        let html = "";
        messages.forEach((msg, index) => {
            const num = index + 1;
            html += `
                <div class="post">
                    <div>
                        <span class="post-num">${num}</span>：
                        <span class="post-name">${escapeHTML(msg.name)}</span>：
                        <span class="post-date">${escapeHTML(msg.date)}</span>
                    </div>
                    <div class="post-body">${escapeHTML(msg.body)}</div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function postMessage() {
        const name = document.getElementById("nameInput").value || "名無しさん";
        const body = document.getElementById("msgInput").value;

        if (!body.trim()) {
            alert("本文を入力してください。");
            return;
        }

        const now = new Date();
        const dateStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()}(${['日','月','火','水','木','金','土'][now.getDay()]}) ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;

        // まず現在のデータを取得してから追加して保存する
        fetch(API_URL)
            .then(res => res.json())
            .then(data => {
                let messages = data.record.messages || [];
                messages.push({ name: name, body: body, date: dateStr });

                // サーバーに送信
                return fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ messages: messages })
                });
            })
            .then(res => {
                if (res.ok) {
                    document.getElementById("msgInput").value = "";
                    fetchMessages(); // 再読み込み
                } else {
                    alert("書き込みに失敗しました。");
                }
            })
            .catch(err => {
                alert("エラーが発生しました: " + err);
            });
    }

    // セキュリティ対策（XSS防止用のエスケープ関数）
    function escapeHTML(str) {
        return str.replace(/[&'`"<>]/g, function(match) {
            return {
                '&': '&amp;',
                '🤞': '&#x1F91E;',
                "'": '&#x27;',
                '`': '&#x60;',
                '"': '&quot;',
                '<': '&lt;',
                '>': '&gt;',
            }[match]
        });
    }

    // ネット接続がない場合のローカルストレージ用バックエンド（おまけ）
    function loadLocalFallback() {
        let localData = JSON.parse(localStorage.getItem("local_bbs_msgs") || "[]");
        renderMessages(localData);
    }
</script>

</body>
</html>
